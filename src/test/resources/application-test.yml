spring:
  datasource:
    url: jdbc:tc:postgresql:16:///diligencias_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      resourceserver:
        jwt:
          # Configuración simulada para evitar fallos en el arranque si no hay OIDC
          issuer-uri: http://localhost:8080/realms/diligencias
          jwk-set-uri: http://localhost:8080/realms/diligencias/protocol/openid-connect/certs

OIDC_ISSUER_URI: http://localhost:8080/realms/diligencias
OIDC_JWK_SET_URI: http://localhost:8080/realms/diligencias/protocol/openid-connect/certs
OIDC_AUDIENCE: diligencias-backend

logging:
  level:
    org.springframework.security: DEBUG
