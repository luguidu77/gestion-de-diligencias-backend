# ─────────────────────────────────────────────────────────────────────────────
# PERFIL: pre
# Entorno de preproducción — Pendiente de configuración por el equipo de TI
# ─────────────────────────────────────────────────────────────────────────────
#
# Este fichero NO contiene credenciales reales en el repositorio de código.
# Los valores del entorno se inyectan mediante variables o secretos del orquestador.
# ─────────────────────────────────────────────────────────────────────────────

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${OIDC_JWK_SET_URI}

app:
  security:
    jwt:
      jwk-set-uri: ${OIDC_JWK_SET_URI}
      issuer-uri: ${OIDC_ISSUER_URI}
      audience: ${OIDC_AUDIENCE}
    claims:
      username: ${CLAIM_USERNAME:preferred_username}
      display-name: ${CLAIM_DISPLAY_NAME:name}
      rank: ${CLAIM_RANK:rango}
      unit: ${CLAIM_UNIT:unidad}
      roles-path: ${CLAIM_ROLES_PATH:roles}

alfresco:
  url: ${ALFRESCO_URL}
  username: ${ALFRESCO_USER}
  password: ${ALFRESCO_PASSWORD}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
