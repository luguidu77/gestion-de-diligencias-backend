name: diligencias-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diligencias
      POSTGRES_USER: diligencias_user
      POSTGRES_PASSWORD: ${DILIGENCIAS_DB_PASSWORD:?Define DILIGENCIAS_DB_PASSWORD antes de arrancar}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diligencias_user -d diligencias"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
